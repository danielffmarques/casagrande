  <!-- Código React compilado pelo Babel no browser -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    /* 1. HOOK useScrollHeader */
    function useScrollHeader({ threshold = 10 } = {}) {
      const [isFixed, setIsFixed] = useState(false);
      const [isScrollUp, setIsScrollUp] = useState(false);
      const [scrollTop, setScrollTop] = useState(0);

      useEffect(() => {
        let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
        let ticking = false;

        const updateScroll = () => {
          const currentScrollY = Math.max(0, window.pageYOffset || document.documentElement.scrollTop);
          const pastThreshold = currentScrollY > threshold;
          setIsFixed(pastThreshold);

          const scrollingUp = currentScrollY < lastScrollY && pastThreshold;
          setIsScrollUp(scrollingUp);

          setScrollTop(currentScrollY);
          lastScrollY = currentScrollY;
          ticking = false;
        };

        const onScroll = () => {
          if (!ticking) {
            window.requestAnimationFrame(updateScroll);
            ticking = true;
          }
        };

        window.addEventListener('scroll', onScroll, { passive: true });
        updateScroll();

        return () => window.removeEventListener('scroll', onScroll);
      }, [threshold]);

      const isVisible = !isFixed || isScrollUp;

      return { isFixed, isScrollUp, isVisible, scrollTop };
    }

    /* 2. COMPONENTE SlidingOverlayButton (AstroAnimate) */
    function SlidingOverlayButton({ as: Component = 'button', href, variant = 'gold', children, onClick, style = {} }) {
      const [isHovered, setIsHovered] = useState(false);

      const colorSchemes = {
        gold: { baseBg: '#C28E58', baseColor: '#FFFFFF', overlayBg: '#211D19', hoverColor: '#FAF7F2' },
        dark: { baseBg: '#211D19', baseColor: '#FAF7F2', overlayBg: '#C28E58', hoverColor: '#FFFFFF' },
        outline: { baseBg: 'transparent', baseColor: '#FFFFFF', overlayBg: '#C28E58', hoverColor: '#FFFFFF' }
      };

      const theme = colorSchemes[variant] || colorSchemes.gold;

      const btnStyle = {
        position: 'relative',
        display: 'inline-flex',
        alignItems: 'center',
        justifyContent: 'center',
        overflow: 'hidden',
        padding: '11px 24px',
        backgroundColor: theme.baseBg,
        color: isHovered ? theme.hoverColor : theme.baseColor,
        border: `1px solid ${isHovered ? theme.overlayBg : (variant === 'outline' ? '#FFFFFF' : theme.baseBg)}`,
        borderRadius: '3px',
        fontFamily: '"Montserrat", sans-serif',
        fontSize: '0.78rem',
        fontWeight: 700,
        letterSpacing: '0.14em',
        textTransform: 'uppercase',
        textDecoration: 'none',
        cursor: 'pointer',
        lineHeight: 1,
        zIndex: 1,
        boxShadow: isHovered ? '0 4px 18px rgba(33, 29, 25, 0.2)' : 'none',
        transform: isHovered ? 'translateY(-1px)' : 'translateY(0)',
        transition: 'color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, transform 0.25s ease',
        ...style
      };

      const overlayStyle = {
        position: 'absolute',
        inset: 0,
        backgroundColor: theme.overlayBg,
        transform: isHovered ? 'translateY(0)' : 'translateY(100%)',
        transition: 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)',
        zIndex: -1,
        pointerEvents: 'none'
      };

      const props = {
        ...(Component === 'a' ? { href } : { type: 'button' }),
        style: btnStyle,
        onMouseEnter: () => setIsHovered(true),
        onMouseLeave: () => setIsHovered(false),
        onClick
      };

      return (
        <Component {...props}>
          <span style={overlayStyle} aria-hidden="true"></span>
          <span style={{ position: 'relative', zIndex: 2 }}>{children}</span>
        </Component>
      );
    }

    /* 3. COMPONENTE ArrowCTAButton (AstroAnimate) */
    function ArrowCTAButton({ as: Component = 'a', href = '#', label, children, accentColor = '#C28E58', color = '#211D19', style = {} }) {
      const [isHovered, setIsHovered] = useState(false);
      const textContent = label || children;

      const containerStyle = {
        display: 'inline-flex',
        alignItems: 'center',
        gap: '12px',
        fontFamily: '"Montserrat", sans-serif',
        fontSize: '0.86rem',
        fontWeight: 600,
        letterSpacing: '0.08em',
        textTransform: 'uppercase',
        color: isHovered ? accentColor : color,
        textDecoration: 'none',
        position: 'relative',
        paddingBottom: '4px',
        cursor: 'pointer',
        background: 'none',
        border: 'none',
        transition: 'color 0.3s ease, transform 0.3s ease',
        transform: isHovered ? 'translateX(3px)' : 'translateX(0)',
        ...style
      };

      const underlineStyle = {
        position: 'absolute',
        bottom: 0,
        left: 0,
        width: '100%',
        height: '1.5px',
        backgroundColor: accentColor,
        transformOrigin: 'left',
        transform: isHovered ? 'scaleX(1)' : 'scaleX(0.25)',
        opacity: isHovered ? 1 : 0.6,
        transition: 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease'
      };

      return (
        <Component
          href={href}
          style={containerStyle}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
        >
          <span>{textContent}</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', transform: isHovered ? 'translateX(5px)' : 'translateX(0)', transition: 'transform 0.3s ease' }} aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 12" width="13" height="11" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
              <line x1="1" y1="6" x2="13" y2="6" />
              <polyline points="8 1 13 6 8 11" />
            </svg>
          </span>
          <span style={underlineStyle} aria-hidden="true" />
        </Component>
      );
    }

    /* 4. COMPONENTE HighlightText (AstroAnimate) */
    function HighlightText({ children, variant = 'background', color = 'rgba(194, 142, 88, 0.32)', trigger = 'hover', style = {} }) {
      const [isActive, setIsActive] = useState(trigger === 'always');

      useEffect(() => {
        if (trigger === 'load') {
          const t = setTimeout(() => setIsActive(true), 200);
          return () => clearTimeout(t);
        }
      }, [trigger]);

      const isUnderline = variant === 'underline';

      const hlStyle = {
        position: 'relative',
        display: 'inline-block',
        backgroundImage: `linear-gradient(120deg, ${color} 0%, ${color} 100%)`,
        backgroundRepeat: 'no-repeat',
        backgroundPosition: isUnderline ? '0 100%' : '0 88%',
        backgroundSize: (isActive || trigger === 'always')
          ? (isUnderline ? '100% 2px' : '100% 0.42em')
          : (isUnderline ? '0% 2px' : '0% 0.42em'),
        transition: 'background-size 500ms cubic-bezier(0.16, 1, 0.3, 1)',
        padding: '0 2px',
        borderRadius: '2px',
        ...style
      };

      const handlers = trigger === 'hover' ? {
        onMouseEnter: () => setIsActive(true),
        onMouseLeave: () => setIsActive(false)
      } : {};

      return (
        <span style={hlStyle} {...handlers}>
          {children}
        </span>
      );
    }

    /* 5. CABEÇALHO FLUTUANTE VUNABAKA */
    function HeaderVunabaka() {
      const { isFixed, isScrollUp, isVisible } = useScrollHeader({ threshold: 10 });

        boxShadow: isSolid ? '0 4px 20px rgba(33, 29, 25, 0.08)' : 'none',

        transition: 'height 0.35s ease, filter 0.35s ease'
      };

      return (
        <header style={headerStyle}>
          <div style={{ maxWidth: '1440px', margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'relative' }}>
            
            <nav style={{ flex: 1, display: 'flex', alignItems: 'center' }}>
              <ul style={{ display: 'flex', alignItems: 'center', gap: '28px', listStyle: 'none', margin: 0, padding: 0 }}>
                <li><a href="alojamentos.html" style={navLinkStyle}>Alojamentos</a></li>
                <li><a href="actividades.html" style={navLinkStyle}>Serra da Estrela</a></li>
                <li><a href="duvidas.html" style={navLinkStyle}>FAQs</a></li>
              </ul>
            </nav>

            <div style={{ position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%, -50%)', textAlign: 'center' }}>
              <a href="index.html">
                <img src="assets/img/logo_center.png" alt="Casa Grande" style={logoImgStyle} />
              </a>
            </div>

            <div style={{ flex: 1, display: 'flex', justifyContent: 'flex-end', alignItems: 'center' }}>
              <SlidingOverlayButton as="a" href="reservas.html" variant={isSolid ? 'dark' : 'gold'}>
                RESERVAR ESTADIA
              </SlidingOverlayButton>
            </div>

          </div>
        </header>
      );
    }

            </div>
          </section>

          {/* Nota Demonstrativa ao Anfitrião */}
