    <path d="M 45 480 L 48 180 Q 49 140, 52 110 L 195 110 Q 198 140, 196 180 L 192 480 Z" stroke-width="1.6" opacity="0.9" />
    
    <!-- Cornija / capitel superior do pilar (talhado à mão) -->
    <path d="M 38 110 L 208 110 L 202 96 L 44 96 Z" stroke-width="1.6" opacity="0.9" />
    <path d="M 32 96 L 214 96 L 208 82 L 38 82 Z" stroke-width="1.8" opacity="0.95" />
    <path d="M 28 82 L 218 82 L 210 68 L 36 68 Z" stroke-width="1.4" opacity="0.85" />
    <!-- Pináculo / remate barroco em esfera sobre plinto nobre -->
    <path d="M 80 68 L 86 44 L 160 44 L 166 68 Z" stroke-width="1.3" opacity="0.85" />
    <circle cx="123" cy="24" r="20" stroke-width="1.5" opacity="0.9" />
    <!-- Hachuras de sombra esférica no pináculo -->
    <g opacity="0.45" stroke-width="0.75">
      <path d="M 125 7 A 17 17 0 0 1 141 26" />
      <path d="M 122 10 A 14 14 0 0 1 135 27" />
      <path d="M 119 14 A 11 11 0 0 1 130 28" />
      <line x1="120" y1="40" x2="136" y2="28" />
      <line x1="126" y1="41" x2="140" y2="31" />
      <line x1="90" y1="64" x2="105" y2="52" />
      <line x1="102" y1="64" x2="117" y2="52" />
      <line x1="115" y1="64" x2="130" y2="52" />
      <line x1="130" y1="64" x2="145" y2="52" />
      <line x1="145" y1="64" x2="158" y2="52" />
    </g>

    <!-- Blocos de cantaria do pilar com juntas de argamassa e texturas de pedra picada -->
    <!-- Fila 1 do pilar -->
    <path d="M 48 175 L 195 174" stroke-width="1.3" opacity="0.85" />
    <path d="M 50 178 L 193 177" stroke-width="0.7" stroke-dasharray="6 8" opacity="0.5" />
    <!-- Fila 2 do pilar -->
    <path d="M 49 238 L 194 236" stroke-width="1.3" opacity="0.85" />
    <path d="M 51 241 L 192 239" stroke-width="0.7" stroke-dasharray="5 7" opacity="0.5" />
    <!-- Fila 3 do pilar -->
    <path d="M 47 302 L 193 300" stroke-width="1.3" opacity="0.85" />
    <path d="M 50 305 L 191 303" stroke-width="0.7" stroke-dasharray="7 5" opacity="0.5" />
    <!-- Fila 4 do pilar -->
    <path d="M 46 365 L 193 364" stroke-width="1.3" opacity="0.85" />
    <path d="M 48 368 L 190 367" stroke-width="0.7" stroke-dasharray="6 9" opacity="0.5" />
    <!-- Fila 5 do pilar -->
    <path d="M 45 425 L 192 423" stroke-width="1.3" opacity="0.85" />
    <path d="M 47 428 L 190 426" stroke-width="0.7" stroke-dasharray="8 6" opacity="0.5" />

