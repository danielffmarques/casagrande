      <line x1="325" y1="345" x2="350" y2="368" />
      <line x1="355" y1="348" x2="380" y2="370" />
      <!-- Bloco F -->
      <line x1="415" y1="345" x2="440" y2="368" />
      <line x1="435" y1="345" x2="460" y2="368" />
      <line x1="470" y1="348" x2="495" y2="370" />
      <!-- Bloco G -->
      <line x1="265" y1="410" x2="290" y2="432" />
      <line x1="285" y1="410" x2="310" y2="432" />
      <line x1="375" y1="410" x2="400" y2="432" />
      <line x1="420" y1="412" x2="445" y2="434" />
      <line x1="480" y1="412" x2="505" y2="434" />
    </g>

    <!-- ==================== HERA E VEGETAÇÃO SILVESTRE A LÁPIS (POÉTICO) ==================== -->
    <!-- Ramo principal de hera antiga que trepa pelo muro e pilar -->
    <path d="M 180 470 Q 185 390, 195 320 T 198 210 Q 190 160, 175 135" stroke-width="1.3" opacity="0.8" />
    <path d="M 195 320 Q 220 280, 255 260 T 320 240" stroke-width="1.1" opacity="0.75" />
    <path d="M 198 210 Q 230 190, 270 185" stroke-width="1.0" opacity="0.7" />

    <!-- Folhas de hera desenhadas a traço fino com nervuras a lápis -->
    <!-- Folha 1 -->
    <path d="M 175 135 Q 160 120, 155 135 Q 150 150, 170 145 Z" stroke-width="1.1" fill="none" opacity="0.85" />
    <line x1="175" y1="135" x2="160" y2="135" stroke-width="0.7" opacity="0.6" />
    <!-- Folha 2 -->
    <path d="M 185 160 Q 205 148, 205 165 Q 195 180, 185 170 Z" stroke-width="1.1" fill="none" opacity="0.85" />
    <line x1="185" y1="160" x2="200" y2="162" stroke-width="0.7" opacity="0.6" />
    <!-- Folha 3 -->
    <path d="M 192 195 Q 170 185, 172 205 Q 185 220, 195 210 Z" stroke-width="1.1" fill="none" opacity="0.85" />
    <line x1="192" y1="195" x2="178" y2="200" stroke-width="0.7" opacity="0.6" />
    <!-- Folha 4 -->
    <path d="M 225 188 Q 240 172, 250 185 Q 245 202, 230 195 Z" stroke-width="1.0" fill="none" opacity="0.85" />
    <line x1="225" y1="188" x2="242" y2="186" stroke-width="0.6" opacity="0.6" />
    <!-- Folha 5 -->
    <path d="M 270 185 Q 285 170, 295 182 Q 290 198, 275 192 Z" stroke-width="1.0" fill="none" opacity="0.85" />
    <!-- Folha 6 -->
    <path d="M 230 275 Q 245 258, 258 270 Q 252 288, 235 282 Z" stroke-width="1.1" fill="none" opacity="0.85" />
    <line x1="230" y1="275" x2="250" y2="272" stroke-width="0.7" opacity="0.6" />
    <!-- Folha 7 -->
    <path d="M 275 252 Q 295 238, 305 250 Q 298 268, 282 262 Z" stroke-width="1.0" fill="none" opacity="0.85" />
    <!-- Folha 8 -->
    <path d="M 315 242 Q 335 230, 342 242 Q 335 258, 320 250 Z" stroke-width="1.0" fill="none" opacity="0.8" />
    <!-- Folha 9 -->
    <path d="M 198 340 Q 215 328, 222 342 Q 215 358, 202 350 Z" stroke-width="1.1" fill="none" opacity="0.85" />
    <!-- Folha 10 -->
    <path d="M 188 385 Q 168 375, 172 392 Q 185 405, 192 395 Z" stroke-width="1.1" fill="none" opacity="0.85" />
    <!-- Folha 11 -->
    <path d="M 190 435 Q 208 422, 215 438 Q 205 452, 195 445 Z" stroke-width="1.1" fill="none" opacity="0.85" />

    <!-- Tufos de ervas e musgo entre as pedras da base -->
    <path d="M 175 480 Q 170 460, 162 452 M 175 480 Q 178 458, 185 450 M 175 480 Q 182 465, 190 460" stroke-width="0.9" opacity="0.7" />
    <path d="M 230 482 Q 225 466, 218 458 M 230 482 Q 235 464, 240 458" stroke-width="0.8" opacity="0.65" />
    <path d="M 335 485 Q 330 470, 324 464 M 335 485 Q 340 468, 346 462" stroke-width="0.8" opacity="0.65" />
  </g>
</svg>
