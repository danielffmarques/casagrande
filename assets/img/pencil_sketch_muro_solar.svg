    <!-- Linhas horizontais e pedras irregulares do muro tradicional da quinta -->
    <!-- Curso 1 -->
    <path d="M 194 270 Q 380 266, 590 268" stroke-width="1.2" opacity="0.8" />
    <path d="M 285 218 L 282 269" stroke-width="1.0" opacity="0.7" />
    <path d="M 390 217 L 393 268" stroke-width="1.0" opacity="0.7" />
    <path d="M 495 216 L 492 267" stroke-width="1.0" opacity="0.7" />

    <!-- Curso 2 -->
    <path d="M 193 330 Q 400 326, 590 328" stroke-width="1.3" opacity="0.8" />
    <path d="M 235 270 L 232 329" stroke-width="1.0" opacity="0.7" />
    <path d="M 340 269 L 344 328" stroke-width="1.0" opacity="0.7" />
    <path d="M 445 268 L 442 327" stroke-width="1.0" opacity="0.7" />
    <path d="M 550 267 L 553 327" stroke-width="1.0" opacity="0.7" />

    <!-- Curso 3 -->
    <path d="M 193 395 Q 390 392, 590 394" stroke-width="1.3" opacity="0.8" />
    <path d="M 290 330 L 288 394" stroke-width="1.0" opacity="0.7" />
    <path d="M 395 329 L 398 393" stroke-width="1.0" opacity="0.7" />
