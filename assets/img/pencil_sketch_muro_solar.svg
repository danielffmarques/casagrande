    <path d="M 250 396 L 248 457" stroke-width="1.0" opacity="0.7" />
    <path d="M 355 395 L 358 456" stroke-width="1.0" opacity="0.7" />
    <path d="M 460 394 L 458 455" stroke-width="1.0" opacity="0.7" />
    <path d="M 560 393 L 562 455" stroke-width="1.0" opacity="0.7" />

    <!-- Hachuras de textura de granito rugoso nas pedras do muro -->
    <g opacity="0.38" stroke-width="0.7">
      <!-- Bloco A -->
      <line x1="205" y1="230" x2="225" y2="248" />
      <line x1="215" y1="230" x2="235" y2="248" />
      <line x1="205" y1="245" x2="220" y2="260" />
      <!-- Bloco B -->
      <line x1="300" y1="232" x2="320" y2="250" />
      <line x1="315" y1="232" x2="335" y2="250" />
      <line x1="350" y1="235" x2="370" y2="252" />
      <!-- Bloco C -->
      <line x1="245" y1="285" x2="270" y2="305" />
      <line x1="260" y1="285" x2="285" y2="305" />
      <line x1="290" y1="288" x2="315" y2="308" />
      <!-- Bloco D -->
      <line x1="360" y1="285" x2="385" y2="305" />
      <line x1="380" y1="285" x2="405" y2="305" />
      <line x1="410" y1="288" x2="430" y2="306" />
      <!-- Bloco E -->
