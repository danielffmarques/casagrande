    <path d="M 10 480 Q 150 475, 320 485 T 590 478" stroke-width="1.8" opacity="0.85" />
    <path d="M 25 487 Q 180 482, 380 490 T 580 485" stroke-width="1.1" stroke-dasharray="8 6" opacity="0.55" />
    <path d="M 40 494 Q 220 490, 440 495 T 560 492" stroke-width="0.8" opacity="0.4" />

    <!-- Hachuras de sombra na base -->
    <g opacity="0.45" stroke-width="0.8">
      <line x1="20" y1="485" x2="35" y2="475" />
      <line x1="40" y1="487" x2="55" y2="477" />
      <line x1="60" y1="488" x2="75" y2="478" />
      <line x1="90" y1="489" x2="105" y2="479" />
      <line x1="120" y1="488" x2="135" y2="478" />
      <line x1="160" y1="490" x2="175" y2="480" />
      <line x1="210" y1="492" x2="225" y2="482" />
      <line x1="280" y1="494" x2="295" y2="484" />
      <line x1="360" y1="493" x2="375" y2="483" />
      <line x1="430" y1="492" x2="445" y2="482" />
      <line x1="500" y1="490" x2="515" y2="480" />
    </g>

    <!-- ==================== PILAR NOBRE DE GRANITO (ESQUERDA) ==================== -->
