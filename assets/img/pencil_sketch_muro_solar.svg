      <line x1="62" y1="114" x2="77" y2="124" />
      <line x1="75" y1="114" x2="90" y2="124" />
      <line x1="90" y1="114" x2="105" y2="124" />
      <line x1="110" y1="114" x2="125" y2="124" />
      <line x1="130" y1="114" x2="145" y2="124" />
      <line x1="150" y1="114" x2="165" y2="124" />
      <line x1="170" y1="114" x2="185" y2="124" />

      <!-- Sombra lateral esquerda do pilar (chanfro e textura de picão) -->
      <line x1="52" y1="130" x2="68" y2="142" />
      <line x1="52" y1="145" x2="68" y2="157" />
      <line x1="52" y1="160" x2="68" y2="172" />
      <line x1="53" y1="190" x2="70" y2="204" />
      <line x1="53" y1="210" x2="70" y2="224" />
      <line x1="53" y1="255" x2="72" y2="270" />
      <line x1="53" y1="275" x2="72" y2="290" />
      <line x1="51" y1="320" x2="72" y2="336" />
      <line x1="51" y1="340" x2="72" y2="356" />
      <line x1="49" y1="380" x2="70" y2="397" />
      <line x1="49" y1="400" x2="70" y2="417" />
      <line x1="48" y1="440" x2="70" y2="458" />
      <line x1="48" y1="460" x2="70" y2="478" />

