    <path d="M 350 203 L 348 216" stroke-width="1.1" opacity="0.75" />
    <path d="M 430 202 L 428 215" stroke-width="1.1" opacity="0.75" />
    <path d="M 515 201 L 513 214" stroke-width="1.1" opacity="0.75" />

    <!-- Sombra sob o albardão do muro -->
    <g opacity="0.4" stroke-width="0.75">
      <line x1="205" y1="219" x2="218" y2="228" />
      <line x1="225" y1="219" x2="238" y2="228" />
      <line x1="245" y1="219" x2="258" y2="228" />
      <line x1="275" y1="218" x2="288" y2="227" />
      <line x1="300" y1="218" x2="313" y2="227" />
      <line x1="325" y1="217" x2="338" y2="226" />
      <line x1="360" y1="217" x2="373" y2="226" />
      <line x1="390" y1="216" x2="403" y2="225" />
      <line x1="420" y1="216" x2="433" y2="225" />
