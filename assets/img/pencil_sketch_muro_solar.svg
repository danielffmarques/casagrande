<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" fill="none">
  <defs>
    <!-- Filtro de textura de grafite / dente de papel antigo -->
    <filter id="pencil-texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#pencil-texture)" stroke="#3f3832" stroke-linecap="round" stroke-linejoin="round">
