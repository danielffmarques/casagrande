<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Filtro de textura de grafite / papel de gravura antiga -->
    <filter id="pencil-texture-camelia" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.048" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#pencil-texture-camelia)" stroke="#3f3832" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Ramo lenhoso principal da camélia antiga com nós e textura a lápis -->
    <path d="M 460 30 Q 360 80, 280 160 T 150 320 Q 110 390, 70 450" stroke-width="2.2" opacity="0.9" />
    <path d="M 465 26 Q 365 76, 284 156 T 154 316 Q 114 386, 75 446" stroke-width="1.0" opacity="0.5" stroke-dasharray="6 4" />
    <!-- Ramificações secundárias -->
    <path d="M 280 160 Q 320 220, 360 270 T 420 340" stroke-width="1.6" opacity="0.85" />
    <path d="M 220 230 Q 180 260, 130 290" stroke-width="1.4" opacity="0.8" />
    <path d="M 330 110 Q 380 90, 430 80" stroke-width="1.3" opacity="0.8" />

    <!-- Hachuras de casca nos ramos lenhosos -->
    <g opacity="0.45" stroke-width="0.75">
      <line x1="390" y1="62" x2="384" y2="72" />
      <line x1="360" y1="85" x2="352" y2="97" />
      <line x1="320" y1="125" x2="310" y2="138" />
      <line x1="260" y1="185" x2="250" y2="198" />
      <line x1="190" y1="270" x2="180" y2="282" />
      <line x1="130" y1="355" x2="120" y2="368" />
      <line x1="95" y1="415" x2="88" y2="425" />
    </g>

    <!-- ==================== FLOR DE CAMÉLIA EM GRAVURA A LÁPIS ==================== -->
    <!-- Centro da Camélia: Estames e Pistilo com pontilhado de grafite -->
    <g transform="translate(250, 200)">
      <circle cx="0" cy="0" r="14" stroke-width="1.2" opacity="0.75" stroke-dasharray="2 3" />
      <!-- Pequenos filamentos e anteras dos estames -->
      <g opacity="0.7" stroke-width="0.8">
        <line x1="-3" y1="-3" x2="-8" y2="-8" />
        <circle cx="-9" cy="-9" r="1.3" fill="#3f3832" />
        <line x1="3" y1="-3" x2="8" y2="-9" />
        <circle cx="9" cy="-10" r="1.3" fill="#3f3832" />
        <line x1="4" y1="2" x2="10" y2="4" />
        <circle cx="11" cy="4" r="1.3" fill="#3f3832" />
        <line x1="-2" y1="4" x2="-6" y2="9" />
        <circle cx="-7" cy="10" r="1.3" fill="#3f3832" />
        <line x1="-4" y1="1" x2="-10" y2="2" />
        <circle cx="-11" cy="2" r="1.3" fill="#3f3832" />
        <line x1="2" y1="-4" x2="5" y2="-11" />
        <circle cx="5" cy="-12" r="1.3" fill="#3f3832" />
      </g>

      <!-- Pétalas Interiores da Camélia (camada 1) com curvas delicadas e hachuras finas -->
      <!-- Pétala Interior Superior -->
      <path d="M -15 -10 Q 0 -38, 22 -32 Q 28 -12, 12 -5" stroke-width="1.3" opacity="0.9" />
      <!-- Hachuras de dobra na pétala -->
      <g opacity="0.38" stroke-width="0.65">
        <path d="M 0 -10 Q 3 -24, 10 -28" />
        <path d="M -5 -8 Q -2 -22, 4 -27" />
        <path d="M 5 -10 Q 8 -22, 15 -25" />
      </g>

      <!-- Pétala Interior Direita -->
      <path d="M 12 -8 Q 38 -15, 42 12 Q 28 25, 8 12" stroke-width="1.3" opacity="0.9" />
      <g opacity="0.38" stroke-width="0.65">
        <path d="M 12 0 Q 26 -2, 32 6" />
        <path d="M 10 5 Q 24 6, 28 14" />
      </g>

      <!-- Pétala Interior Inferior -->
      <path d="M 5 12 Q 18 36, -8 40 Q -26 28, -12 8" stroke-width="1.3" opacity="0.9" />
      <g opacity="0.38" stroke-width="0.65">
        <path d="M 0 12 Q 4 25, -2 30" />
        <path d="M -6 10 Q -4 24, -12 28" />
      </g>

      <!-- Pétala Interior Esquerda -->
      <path d="M -12 5 Q -38 18, -42 -8 Q -28 -22, -12 -8" stroke-width="1.3" opacity="0.9" />
      <g opacity="0.38" stroke-width="0.65">
        <path d="M -10 0 Q -24 3, -30 -4" />
        <path d="M -8 -5 Q -22 -6, -26 -12" />
      </g>

      <!-- Pétalas Exteriores Majestosas (camada 2) em estilo clássico de gravura -->
      <!-- Pétala Topo-Esquerda -->
      <path d="M -22 -30 Q -45 -70, 0 -78 Q 35 -65, 25 -32" stroke-width="1.5" opacity="0.92" />
      <g opacity="0.35" stroke-width="0.7">
        <path d="M -15 -35 Q -25 -58, -2 -65" />
        <path d="M -5 -35 Q -10 -60, 8 -66" />
        <path d="M 8 -32 Q 5 -55, 18 -60" />
      </g>

      <!-- Pétala Topo-Direita -->
      <path d="M 24 -30 Q 72 -45, 82 -2 Q 65 24, 40 10" stroke-width="1.5" opacity="0.92" />
      <g opacity="0.35" stroke-width="0.7">
        <path d="M 28 -20 Q 55 -28, 65 -6" />
        <path d="M 30 -8 Q 54 -12, 60 5" />
        <path d="M 32 4 Q 50 6, 52 14" />
      </g>

      <!-- Pétala Fundo-Direita -->
      <path d="M 38 15 Q 75 48, 48 82 Q 10 75, 4 38" stroke-width="1.5" opacity="0.92" />
      <g opacity="0.35" stroke-width="0.7">
        <path d="M 28 20 Q 52 42, 38 65" />
        <path d="M 18 24 Q 38 48, 26 66" />
        <path d="M 8 28 Q 22 50, 14 62" />
      </g>

      <!-- Pétala Fundo-Esquerda -->
      <path d="M 0 38 Q -35 82, -75 55 Q -68 18, -38 6" stroke-width="1.5" opacity="0.92" />
      <g opacity="0.35" stroke-width="0.7">
        <path d="M -8 30 Q -32 58, -58 45" />
        <path d="M -18 22 Q -40 46, -55 30" />
        <path d="M -25 15 Q -42 32, -50 18" />
      </g>

      <!-- Pétala Meio-Esquerda -->
      <path d="M -38 4 Q -82 -5, -72 -48 Q -40 -50, -22 -30" stroke-width="1.5" opacity="0.92" />
      <g opacity="0.35" stroke-width="0.7">
        <path d="M -30 -2 Q -62 -8, -55 -38" />
        <path d="M -26 -14 Q -50 -20, -45 -40" />
      </g>
    </g>

    <!-- ==================== BOTÃO DE FLOR JOVEM (NO RAMO SUPERIOR) ==================== -->
    <g transform="translate(390, 85) rotate(-25)">
      <!-- Cálice de sépalas com hachuras a lápis -->
      <path d="M -8 18 Q -12 2, 0 -12 Q 12 2, 8 18 Z" stroke-width="1.3" opacity="0.9" />
      <!-- Pétalas fechadas em espiral -->
      <path d="M -5 -10 Q 0 -28, 6 -10" stroke-width="1.2" opacity="0.85" />
      <path d="M -1 -12 Q 3 -24, 8 -8" stroke-width="1.0" opacity="0.7" />
      <g opacity="0.4" stroke-width="0.65">
        <line x1="-6" y1="12" x2="-2" y2="4" />
        <line x1="-2" y1="14" x2="2" y2="6" />
        <line x1="2" y1="14" x2="6" y2="6" />
      </g>
    </g>

    <!-- ==================== FOLHAS DE CAMÉLIA A LÁPIS (COM NERVURAS) ==================== -->
    <!-- Folha 1 (Superior Direita) -->
    <g transform="translate(320, 100) rotate(35)">
      <path d="M 0 0 Q 30 -35, 75 -25 Q 65 15, 0 0" stroke-width="1.4" opacity="0.9" />
      <!-- Nervura central a lápis -->
      <path d="M 0 0 Q 38 -12, 75 -25" stroke-width="1.1" opacity="0.8" />
      <!-- Nervuras secundárias e hachuras botânicas -->
      <g opacity="0.45" stroke-width="0.65">
        <line x1="18" y1="-5" x2="28" y2="-18" />
        <line x1="32" y1="-9" x2="45" y2="-21" />
        <line x1="48" y1="-14" x2="60" y2="-23" />
        <line x1="22" y1="-6" x2="30" y2="4" />
        <line x1="36" y1="-10" x2="48" y2="-2" />
        <line x1="50" y1="-15" x2="62" y2="-8" />
      </g>
    </g>

    <!-- Folha 2 (Lateral Esquerda da Flor) -->
    <g transform="translate(160, 220) rotate(-45)">
      <path d="M 0 0 Q -35 -40, -85 -20 Q -70 25, 0 0" stroke-width="1.4" opacity="0.9" />
      <path d="M 0 0 Q -42 -10, -85 -20" stroke-width="1.1" opacity="0.8" />
      <g opacity="0.45" stroke-width="0.65">
        <line x1="-20" y1="-5" x2="-32" y2="-22" />
        <line x1="-38" y1="-9" x2="-52" y2="-24" />
        <line x1="-55" y1="-13" x2="-70" y2="-22" />
        <line x1="-22" y1="-4" x2="-34" y2="8" />
        <line x1="-40" y1="-9" x2="-54" y2="4" />
        <line x1="-58" y1="-14" x2="-70" y2="-4" />
      </g>
    </g>

    <!-- Folha 3 (Lateral Direita da Flor) -->
    <g transform="translate(340, 240) rotate(50)">
      <path d="M 0 0 Q 35 -35, 80 -15 Q 65 30, 0 0" stroke-width="1.4" opacity="0.9" />
      <path d="M 0 0 Q 40 -8, 80 -15" stroke-width="1.1" opacity="0.8" />
      <g opacity="0.45" stroke-width="0.65">
        <line x1="20" y1="-4" x2="32" y2="-18" />
        <line x1="38" y1="-7" x2="52" y2="-20" />
        <line x1="55" y1="-11" x2="68" y2="-18" />
        <line x1="22" y1="-4" x2="34" y2="8" />
        <line x1="40" y1="-8" x2="54" y2="5" />
      </g>
    </g>

    <!-- Folha 4 (Inferior Ramo Central) -->
    <g transform="translate(180, 310) rotate(-15)">
      <path d="M 0 0 Q -30 -35, -75 -15 Q -60 25, 0 0" stroke-width="1.3" opacity="0.88" />
      <path d="M 0 0 Q -38 -8, -75 -15" stroke-width="1.0" opacity="0.75" />
      <g opacity="0.4" stroke-width="0.65">
        <line x1="-18" y1="-4" x2="-28" y2="-18" />
        <line x1="-34" y1="-7" x2="-48" y2="-19" />
        <line x1="-52" y1="-11" x2="-64" y2="-18" />
        <line x1="-20" y1="-3" x2="-30" y2="8" />
        <line x1="-38" y1="-7" x2="-50" y2="5" />
      </g>
    </g>

    <!-- Folha 5 (Base do Ramo Principal) -->
    <g transform="translate(120, 390) rotate(25)">
      <path d="M 0 0 Q 28 -30, 70 -12 Q 55 24, 0 0" stroke-width="1.3" opacity="0.88" />
      <path d="M 0 0 Q 35 -6, 70 -12" stroke-width="1.0" opacity="0.75" />
      <g opacity="0.4" stroke-width="0.65">
        <line x1="18" y1="-3" x2="28" y2="-16" />
        <line x1="34" y1="-6" x2="46" y2="-18" />
        <line x1="20" y1="-3" x2="30" y2="8" />
      </g>
    </g>
  </g>
</svg>
