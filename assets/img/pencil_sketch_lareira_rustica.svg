<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" fill="none">
  <defs>
    <!-- Filtro de textura de grafite e traço de lápis manual -->
    <filter id="pencil-texture-lareira" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#pencil-texture-lareira)" stroke="#3f3832" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Linha do chão em lajes de granito da sala -->
    <path d="M 20 480 Q 200 478, 380 482 T 580 480" stroke-width="1.8" opacity="0.85" />
    <path d="M 35 488 Q 230 485, 420 490 T 565 487" stroke-width="1.0" stroke-dasharray="8 6" opacity="0.5" />
    <!-- Cortes das lajes do chão -->
    <path d="M 140 480 L 125 495" stroke-width="0.9" opacity="0.6" />
    <path d="M 300 481 L 285 496" stroke-width="0.9" opacity="0.6" />
    <path d="M 460 480 L 445 495" stroke-width="0.9" opacity="0.6" />

    <!-- ==================== A RECORDAÇÃO NOBRE DA LAREIRA ==================== -->
    <!-- Prateleira / Cimalha superior da lareira em granito esculpido -->
    <path d="M 50 120 L 550 120 L 540 102 L 60 102 Z" stroke-width="1.8" opacity="0.92" />
    <path d="M 40 102 L 560 102 L 552 86 L 48 86 Z" stroke-width="1.5" opacity="0.88" />
    
    <!-- Hachuras de sombra sob a cimalha -->
    <g opacity="0.45" stroke-width="0.75">
      <line x1="60" y1="123" x2="72" y2="132" />
      <line x1="80" y1="123" x2="92" y2="132" />
      <line x1="110" y1="123" x2="122" y2="132" />
      <line x1="140" y1="123" x2="152" y2="132" />
      <line x1="180" y1="123" x2="192" y2="132" />
      <line x1="220" y1="123" x2="232" y2="132" />
      <line x1="270" y1="123" x2="282" y2="132" />
      <line x1="320" y1="123" x2="332" y2="132" />
      <line x1="370" y1="123" x2="382" y2="132" />
      <line x1="420" y1="123" x2="432" y2="132" />
      <line x1="460" y1="123" x2="472" y2="132" />
      <line x1="500" y1="123" x2="512" y2="132" />
      <line x1="530" y1="123" x2="542" y2="132" />
    </g>

    <!-- Viga / Lintel de granito maciço sobre a boca da lareira -->
    <path d="M 75 120 L 525 120 L 525 185 L 75 185 Z" stroke-width="1.8" opacity="0.9" />
    <!-- Friso esculpido subtil no lintel (volutas de lápis finas) -->
    <path d="M 120 152 Q 200 148, 300 152 T 480 152" stroke-width="0.9" opacity="0.5" stroke-dasharray="12 4" />
    <path d="M 285 142 Q 300 135, 315 142 Q 300 160, 285 142" stroke-width="1.1" opacity="0.65" />
    <!-- Hachuras de relevo do lintel -->
    <g opacity="0.35" stroke-width="0.7">
      <line x1="85" y1="130" x2="105" y2="148" />
      <line x1="100" y1="130" x2="120" y2="148" />
      <line x1="140" y1="132" x2="160" y2="150" />
      <line x1="440" y1="132" x2="460" y2="150" />
      <line x1="480" y1="130" x2="500" y2="148" />
      <line x1="500" y1="130" x2="520" y2="148" />
    </g>

    <!-- Mísulas / Mísulas laterais com volutas barrocas em cantaria -->
    <!-- Mísula Esquerda -->
    <path d="M 75 185 Q 65 210, 72 230 Q 82 250, 75 270 L 105 270 L 105 185 Z" stroke-width="1.5" opacity="0.9" />
    <path d="M 78 200 Q 88 215, 84 235" stroke-width="1.0" opacity="0.6" />
    <!-- Mísula Direita -->
    <path d="M 525 185 Q 535 210, 528 230 Q 518 250, 525 270 L 495 270 L 495 185 Z" stroke-width="1.5" opacity="0.9" />
    <path d="M 522 200 Q 512 215, 516 235" stroke-width="1.0" opacity="0.6" />

    <!-- Pilares laterais da lareira (ombreiras de pedra aparelhada) -->
    <!-- Ombreira Esquerda -->
    <path d="M 75 270 L 70 480 L 140 480 L 140 270 Z" stroke-width="1.7" opacity="0.92" />
    <path d="M 74 340 L 140 338" stroke-width="1.2" opacity="0.8" />
    <path d="M 72 410 L 140 408" stroke-width="1.2" opacity="0.8" />
    <!-- Ombreira Direita -->
    <path d="M 460 270 L 460 480 L 530 480 L 525 270 Z" stroke-width="1.7" opacity="0.92" />
    <path d="M 460 338 L 527 340" stroke-width="1.2" opacity="0.8" />
    <path d="M 460 408 L 529 410" stroke-width="1.2" opacity="0.8" />

    <!-- Chanfros e hachuras de profundidade nas ombreiras -->
    <g opacity="0.45" stroke-width="0.75">
      <!-- Ombreira Esquerda -->
      <line x1="80" y1="285" x2="98" y2="302" />
      <line x1="95" y1="285" x2="113" y2="302" />
      <line x1="80" y1="355" x2="100" y2="374" />
      <line x1="100" y1="355" x2="120" y2="374" />
      <line x1="80" y1="425" x2="102" y2="445" />
      <line x1="102" y1="425" x2="124" y2="445" />
      <!-- Ombreira Direita -->
      <line x1="475" y1="285" x2="495" y2="302" />
      <line x1="495" y1="285" x2="515" y2="302" />
      <line x1="475" y1="355" x2="495" y2="374" />
      <line x1="495" y1="355" x2="515" y2="374" />
      <line x1="475" y1="425" x2="498" y2="445" />
      <line x1="498" y1="425" x2="520" y2="445" />
    </g>

    <!-- Boca profunda da lareira (arco rústico rebaixado) -->
    <path d="M 140 480 L 140 230 Q 300 205, 460 230 L 460 480" stroke-width="1.8" opacity="0.95" />
    
    <!-- Fundo de alvenaria refractária e granito escurecido (hachuras densas de lápis a 45º) -->
    <g opacity="0.32" stroke-width="0.85">
      <!-- Hachuras cruzadas de profundidade do fogo -->
      <line x1="150" y1="240" x2="220" y2="310" />
      <line x1="170" y1="235" x2="250" y2="315" />
      <line x1="200" y1="230" x2="290" y2="320" />
      <line x1="240" y1="225" x2="340" y2="325" />
      <line x1="280" y1="222" x2="390" y2="332" />
      <line x1="330" y1="225" x2="430" y2="325" />
      <line x1="370" y1="228" x2="450" y2="308" />
      <line x1="410" y1="235" x2="455" y2="280" />

      <!-- Cruzamento suave de grafite -->
      <line x1="220" y1="310" x2="160" y2="370" />
      <line x1="260" y1="310" x2="190" y2="380" />
      <line x1="310" y1="310" x2="230" y2="390" />
      <line x1="360" y1="310" x2="280" y2="390" />
      <line x1="410" y1="310" x2="340" y2="380" />
      <line x1="445" y1="310" x2="390" y2="365" />
    </g>

    <!-- Andirões de ferro forjado tradicional português (com argolas torneadas) -->
    <!-- Andirã Esquerdo -->
    <path d="M 215 480 L 218 390 L 225 385 L 222 480" stroke-width="1.6" opacity="0.9" />
    <circle cx="221" cy="376" r="8" stroke-width="1.4" opacity="0.9" />
    <path d="M 210 478 L 225 478 L 230 482 L 205 482 Z" stroke-width="1.3" opacity="0.85" />
    <!-- Andirã Direito -->
    <path d="M 385 480 L 382 390 L 375 385 L 378 480" stroke-width="1.6" opacity="0.9" />
    <circle cx="379" cy="376" r="8" stroke-width="1.4" opacity="0.9" />
    <path d="M 375 478 L 390 478 L 395 482 L 370 482 Z" stroke-width="1.3" opacity="0.85" />

    <!-- Troncos de lenha de oliveira pousados sobre a grelha -->
    <!-- Tronco 1 (Base inclinado à esquerda) -->
    <path d="M 185 470 Q 240 435, 330 430 Q 338 438, 335 448 Q 250 455, 195 480 Z" stroke-width="1.5" opacity="0.92" />
    <!-- Círculo da secção cortada da madeira -->
    <ellipse cx="192" cy="475" rx="9" ry="6" stroke-width="1.2" opacity="0.85" />
    <circle cx="192" cy="475" r="3" stroke-width="0.8" opacity="0.6" />
    <!-- Fissuras e textura de casca de oliveira a lápis -->
    <g opacity="0.5" stroke-width="0.75">
      <path d="M 220 455 Q 260 445, 305 440" />
      <path d="M 235 460 Q 275 450, 315 445" />
    </g>

    <!-- Tronco 2 (Cruzado à direita) -->
    <path d="M 410 472 Q 355 438, 265 432 Q 258 440, 262 450 Q 345 458, 400 480 Z" stroke-width="1.5" opacity="0.92" />
    <ellipse cx="405" cy="476" rx="9" ry="6" stroke-width="1.2" opacity="0.85" />
    <circle cx="405" cy="476" r="3" stroke-width="0.8" opacity="0.6" />
    <g opacity="0.5" stroke-width="0.75">
      <path d="M 380 457 Q 340 448, 295 442" />
      <path d="M 365 463 Q 325 453, 285 448" />
    </g>

    <!-- Tronco 3 (No cimo, em brasa) -->
    <path d="M 230 440 Q 300 415, 370 435 Q 365 445, 355 450 Q 295 432, 235 450 Z" stroke-width="1.4" opacity="0.88" />

    <!-- Traços poéticos de brasas e crepitar da lareira a lápis fino -->
    <g opacity="0.6" stroke-width="0.85">
      <!-- Curvas de calor poéticas a subir suavemente -->
      <path d="M 285 405 Q 280 375, 292 355 T 288 320" stroke-dasharray="4 4" />
      <path d="M 305 400 Q 315 365, 302 340 T 312 305" stroke-dasharray="5 4" />
      <path d="M 325 408 Q 330 380, 320 360 T 328 325" stroke-dasharray="4 5" />
      <!-- Pequenas fagulhas de grafite -->
      <circle cx="295" cy="340" r="1.2" fill="#3f3832" />
      <circle cx="318" cy="325" r="1.5" fill="#3f3832" />
      <circle cx="282" cy="300" r="1.0" fill="#3f3832" />
      <circle cx="308" cy="285" r="1.2" fill="#3f3832" />
    </g>

    <!-- Candeeiro rústico ou ramo seco pousado sobre a cimalha (toque poético e caseiro) -->
    <path d="M 440 85 Q 465 55, 500 50" stroke-width="1.1" opacity="0.7" />
    <path d="M 465 55 Q 480 40, 510 38" stroke-width="0.9" opacity="0.65" />
    <ellipse cx="502" cy="50" rx="6" ry="3" stroke-width="0.8" opacity="0.7" />
    <ellipse cx="512" cy="38" rx="5" ry="2.5" stroke-width="0.8" opacity="0.65" />
    <ellipse cx="480" cy="58" rx="5" ry="3" stroke-width="0.8" opacity="0.65" />
  </g>
</svg>
