<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 90" width="100%" height="90" preserveAspectRatio="none" fill="none">
  <!-- Linha Arquitetónica Contínua da Serra e Cumeeiras do Solar -->
  <g stroke="#3a332a" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" opacity="0.32">
    <!-- Linha 1: Cordilheira Suave da Serra da Estrela -->
    <path d="M 0 55 Q 180 35, 340 45 T 680 25 Q 860 12, 1040 32 T 1320 20 T 1440 28" />
    <path d="M 0 62 Q 220 48, 480 54 T 960 42 T 1440 48" stroke-dasharray="6 8" opacity="0.45" />

    <!-- Silhuetas em Traço Fino das Cumeeiras de Granito e Chaminés do Solar -->
    <g transform="translate(180, 22)">
      <!-- Casa Senhorial: Telhado de 4 Águas e Chaminé Setecentista -->
      <path d="M 0 35 L 28 15 L 75 15 L 105 35 Z" />
      <path d="M 45 15 L 45 4 L 55 4 L 55 15" />
      <path d="M 42 4 L 58 4" stroke-width="1.2" />
      <!-- Pequena Cruz / Catavento Nobre de Ferro -->
      <line x1="50" y1="4" x2="50" y2="-4" />
      <line x1="47" y1="-2" x2="53" y2="-2" />
    </g>

    <g transform="translate(540, 16)">
      <!-- Eira e Muro de Granito -->
      <path d="M 0 38 L 45 38 L 55 28 L 95 28 L 105 38 L 160 38" />
      <line x1="75" y1="28" x2="75" y2="38" stroke-dasharray="2 3" />
    </g>

    <g transform="translate(890, 18)">
      <!-- Casa de Campo: Telhado Rústico com Tronco de Oliveira -->
      <path d="M 0 36 L 22 20 L 68 20 L 90 36 Z" />
      <path d="M 28 20 L 28 10 L 36 10 L 36 20" />
      <!-- Ramos de Oliveira em Traço Fino -->
      <path d="M 105 36 Q 115 15, 125 10 M 115 22 Q 128 20, 135 25 M 120 16 Q 130 10, 140 12" />
    </g>

    <g transform="translate(1180, 14)">
      <!-- Torre Sineira da Aldeia de Paços da Serra -->
      <path d="M 0 42 L 18 20 L 18 0 L 26 -8 L 34 0 L 34 20 L 52 42" />
      <line x1="26" y1="-8" x2="26" y2="-14" stroke-width="1.2" />
      <circle cx="26" cy="10" r="3" />
    </g>

    <!-- Linha Base de Assentamento de Cantaria (Régua Arquitetónica com Marcadores de Escala) -->
    <line x1="0" y1="82" x2="1440" y2="82" stroke-width="0.8" opacity="0.6" />
    <!-- Ticks de régua de arquiteto a cada 120px -->
    <line x1="120" y1="78" x2="120" y2="82" />
    <line x1="240" y1="78" x2="240" y2="82" />
    <line x1="360" y1="76" x2="360" y2="82" stroke-width="1.2" />
    <line x1="480" y1="78" x2="480" y2="82" />
    <line x1="600" y1="78" x2="600" y2="82" />
    <line x1="720" y1="74" x2="720" y2="82" stroke-width="1.4" />
    <line x1="840" y1="78" x2="840" y2="82" />
    <line x1="960" y1="78" x2="960" y2="82" />
    <line x1="1080" y1="76" x2="1080" y2="82" stroke-width="1.2" />
    <line x1="1200" y1="78" x2="1200" y2="82" />
    <line x1="1320" y1="78" x2="1320" y2="82" />
  </g>
</svg>
